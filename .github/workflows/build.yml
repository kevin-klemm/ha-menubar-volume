name: Build & Release

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Create a release when a version tag is pushed
  release:
    types: [published]

jobs:
  build-and-test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          # Use the latest Xcode 16.x available on the runner
          XCODE_PATH=$(ls -d /Applications/Xcode_16*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$XCODE_PATH" ]; then
            XCODE_PATH="/Applications/Xcode.app"
          fi
          echo "Using Xcode at: $XCODE_PATH"
          sudo xcode-select -s "$XCODE_PATH/Contents/Developer"

      - name: Show build environment
        run: |
          xcodebuild -version
          sw_vers

      - name: Build
        run: |
          xcodebuild build \
            -project ha-menubar-volume.xcodeproj \
            -scheme ha-menubar-volume \
            -configuration Release \
            -derivedDataPath build \
            MACOSX_DEPLOYMENT_TARGET=14.0 \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Run tests
        run: |
          xcodebuild test \
            -project ha-menubar-volume.xcodeproj \
            -scheme ha-menubar-volume \
            -configuration Debug \
            -derivedDataPath build \
            MACOSX_DEPLOYMENT_TARGET=14.0 \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Package app
        run: |
          APP_PATH="build/Build/Products/Release/ha-menubar-volume.app"
          ditto -c -k --keepParent "$APP_PATH" ha-menubar-volume.zip

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ha-menubar-volume
          path: ha-menubar-volume.zip

  release:
    needs: build-and-test
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: ha-menubar-volume

      - name: Attach to release
        uses: softprops/action-gh-release@v2
        with:
          files: ha-menubar-volume.zip
