name: Build & Release

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Create a release when a version tag is pushed
  release:
    types: [published]

jobs:
  build-and-test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Show build environment
        run: |
          xcodebuild -version
          sw_vers

      - name: Build
        run: |
          xcodebuild build \
            -project ha-menubar-volume.xcodeproj \
            -scheme ha-menubar-volume \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Run tests
        run: |
          xcodebuild test \
            -project ha-menubar-volume.xcodeproj \
            -scheme ha-menubar-volumeTests \
            -configuration Debug \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Package app
        run: |
          APP_PATH="build/Build/Products/Release/ha-menubar-volume.app"
          ditto -c -k --keepParent "$APP_PATH" ha-menubar-volume.zip

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ha-menubar-volume
          path: ha-menubar-volume.zip

  release:
    needs: build-and-test
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: ha-menubar-volume

      - name: Attach to release
        uses: softprops/action-gh-release@v2
        with:
          files: ha-menubar-volume.zip
