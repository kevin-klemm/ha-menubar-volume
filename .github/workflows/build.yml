name: Build & Release

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Build, sign the update, and attach assets when a version tag is released
  release:
    types: [published]

jobs:
  build-and-test:
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          # Use the latest Xcode 16.x available on the runner
          XCODE_PATH=$(ls -d /Applications/Xcode_16*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$XCODE_PATH" ]; then
            XCODE_PATH="/Applications/Xcode.app"
          fi
          echo "Using Xcode at: $XCODE_PATH"
          sudo xcode-select -s "$XCODE_PATH/Contents/Developer"

      - name: Show build environment
        run: |
          xcodebuild -version
          sw_vers

      - name: Derive version
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            TAG="${{ github.event.release.tag_name }}"
            VERSION="${TAG#v}"            # strip a leading "v" (v1.2.3 -> 1.2.3)
          else
            VERSION="0.0.0"               # untagged dev build
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Marketing version: $VERSION  (build ${{ github.run_number }})"

      - name: Build
        run: |
          xcodebuild build \
            -project ha-menubar-volume.xcodeproj \
            -scheme ha-menubar-volume \
            -configuration Release \
            -derivedDataPath build \
            MACOSX_DEPLOYMENT_TARGET=14.0 \
            MARKETING_VERSION="${{ steps.ver.outputs.version }}" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            ARCHS="arm64 x86_64" \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=YES

      - name: Run tests
        run: |
          xcodebuild test \
            -project ha-menubar-volume.xcodeproj \
            -scheme ha-menubar-volume \
            -configuration Debug \
            -derivedDataPath build \
            MACOSX_DEPLOYMENT_TARGET=14.0 \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Create DMG
        run: |
          APP="build/Build/Products/Release/Home Assistant Volume.app"
          STAGING="dmg-staging"
          rm -rf "$STAGING" && mkdir -p "$STAGING"
          cp -R "$APP" "$STAGING/"
          ln -s /Applications "$STAGING/Applications"
          hdiutil create \
            -volname "Home Assistant Volume" \
            -srcfolder "$STAGING" \
            -ov -format UDZO \
            "ha-menubar-volume.dmg"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ha-menubar-volume-dmg
          path: ha-menubar-volume.dmg

      # --- Release-only: sign the update and publish the Sparkle appcast ---

      - name: Generate signed appcast
        if: github.event_name == 'release'
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          if [ -z "$SPARKLE_PRIVATE_KEY" ]; then
            echo "::error::SPARKLE_PRIVATE_KEY secret is not set — cannot sign the update."
            echo "Add the contents of sparkle_private_key.txt as a repo secret named SPARKLE_PRIVATE_KEY."
            exit 1
          fi
          TOOLS="build/SourcePackages/artifacts/sparkle/Sparkle/bin"
          TAG="${{ github.event.release.tag_name }}"
          UPDATES="updates"
          mkdir -p "$UPDATES"
          cp "ha-menubar-volume.dmg" "$UPDATES/"
          # generate_appcast reads the EdDSA private key from stdin via "--ed-key-file -"
          printf '%s' "$SPARKLE_PRIVATE_KEY" | "$TOOLS/generate_appcast" \
            --ed-key-file - \
            --download-url-prefix "https://github.com/${{ github.repository }}/releases/download/$TAG/" \
            --link "https://github.com/${{ github.repository }}" \
            "$UPDATES"
          cp "$UPDATES/appcast.xml" appcast.xml
          echo "Generated appcast:"
          cat appcast.xml

      - name: Attach assets to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ha-menubar-volume.dmg
            appcast.xml
